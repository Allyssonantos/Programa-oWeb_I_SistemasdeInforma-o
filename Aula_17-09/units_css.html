<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units</title>
    <style>

        h1{
            background-color: antiquewhite;
        }

        #main{
            font-size: 50px; /*Medida Fixa*/
        }

        #px{
            font-size: 32px; /*Medida Fixa*/
        }
        #porcentagem{
            font-size: 50%; /*Medida flexível que se baseia no elemento pai*/
        }

        #em{
            font-size: 2em; /*Medida flexível que se baseia no elemento pai*/
        }

        #rem{
            font-size: 2rem; /*Medida flexível que se baseia no elemento raiz*/
        }

        #vw{
            font-size: 10vw; /*Medida flexível que se baseia na largura da tela*/
        }

        #vh{
            font-size: 10vh; /*Medida flexível que se baseia na altura da tela*/
        }


    </style>
</head>

<main id="main">
    <body>
        <h1 id="px">50px</h1>
        <h1 id="porcentagem">50%</h1>
        <h1 id="em">2em</h1>
        <h1 id="rem">2rem</h1>
        <h1 id="vw">10vw</h1>
        <h1 id="vh">10vh</h1>
    </body>
</main>

</html>
