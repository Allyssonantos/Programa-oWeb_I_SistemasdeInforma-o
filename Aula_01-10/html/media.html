<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
</head>
<body>
    <h1>Calculadora de Média</h1>
    <p>Digite as cincos notas do aluno:</p>

    <form id="formulario">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" type="number" min="0">
        <br><br>
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" type="number" min="0">
        <br><br>
        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" type="number" min="0">
        <br><br>
        <label for="nota4">Nota 4:</label>
        <input type="number" id="nota4" type="number" min="0">
        <br><br>
        <label for="nota5">Nota 5:</label>
        <input type="number" id="nota5" type="number" min="0">
        <br><br>
        <button type="button" onclick="calcularMedia()">Calcular Média</button>
    </form>

    <h3 id="resultado"></h3>

    <p> A Média final foi: <span id="media"></span></p>

    <script src="../js/media.js"></script>

</body>
</html>
